document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

play:flex;gap:6px;flex-wrap:wrap;pointer-events:auto}\n  .ctrls button{font:inherit;font-size:12px;padding:7px 11px;border:1px solid #bdb6aa;background:#f7f4ef;color:#22201c;border-radius:3px;cursor:pointer}\n  .ctrls button:hover{background:#fff}\n  .ctrls button[aria-pressed=\"true\"]{background:#22201c;color:#f7f4ef;border-color:#22201c}\n  .hud summary{list-style:none;cursor:pointer;pointer-events:auto;display:flex;align-items:center;gap:10px;user-select:none}\n  .hud summary::-webkit-details-marker{display:none}\n  .hud summary::after{content:\"\";width:7px;height:7px;border-right:1.5px solid #22201c;border-bottom:1.5px solid #22201c;transform:rotate(-45deg);margin-left:auto;transition:transform .15s}\n  .hud details[open] summary::after{transform:rotate(45deg)}\n  .hud details[open] .body{display:flex;flex-direction:column;gap:10px;margin-top:10px}\n  .hud details:not([open]){padding:0}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<three-d-stage name=\"southern-fm-studios\" background=\"#ece8e1\"><\u002Fthree-d-stage>\n<div class=\"hud\"><details id=\"hudMenu\" open=\"\">\n  <summary><span class=\"title\">Southern FM · AS258-4<\u002Fspan><\u002Fsummary>\n  <div class=\"body\">\n  <div class=\"sub\">Blue + Red studios (Series 2, double layer, semi-disconnected) and Storage (Series 1, single layer). Built from SK-100 – SK-202.<\u002Fdiv>\n  <div class=\"ctrls\">\n    <button id=\"roofBtn\" aria-pressed=\"false\">Remove roofs<\u002Fbutton>\n    <button id=\"doorBtn\" aria-pressed=\"true\">Doors open<\u002Fbutton>\n    <button id=\"bldBtn\" aria-pressed=\"true\">Existing walls<\u002Fbutton>\n    <button id=\"wallBtn\" aria-pressed=\"true\">Acoustic panels<\u002Fbutton>\n    <button id=\"micBtn\" aria-pressed=\"false\">Mics live<\u002Fbutton>\n    <button id=\"mic4Btn\" aria-pressed=\"false\">Mic 4 eye-line<\u002Fbutton>\n    <button id=\"slatBtn\" aria-pressed=\"true\">Reception slats<\u002Fbutton>\n    <button id=\"curtainBtn\" aria-pressed=\"false\">Open curtain<\u002Fbutton>\n    <button id=\"standBtn\" aria-pressed=\"false\">Stand desks<\u002Fbutton>\n    <button id=\"peopleBtn\" aria-pressed=\"false\">People<\u002Fbutton>\n  <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdetails><\u002Fdiv>\n<script>\n  { const d = document.getElementById('hudMenu'); if (localStorage.getItem('sfm_hud_open') === '0') d.open = false;\n    d.addEventListener('toggle', () => localStorage.setItem('sfm_hud_open', d.open ? '1' : '0'));\n    addEventListener('keydown', e => { if (e.key === 'h' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) document.querySelector('.hud').hidden ^= 1; }); }\n<\u002Fscript>\n<script src=\"7e107a3c-8f89-462c-b10b-4e4b17b7ab53\"><\u002Fscript>\n<script type=\"module\">\nconst stage = document.querySelector('three-d-stage');\nconst { THREE } = await stage.ready;\n\nconst M = (name, color, rough = 0.85, metal = 0, extra = {}) => {\n  const m = new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, ...extra });\n  m.name = name; return m;\n};\nconst mat = {\n  natural: M('durra_natural', 0xd9c7a4, 0.92),\n  white:   M('ext_white_textured', 0xf3f1ec, 0.95),\n  steel:   M('galvanised_steel', 0xb9bec2, 0.42, 0.35),\n  blue:    M('int_integrity_blue', 0x2f4f86, 0.95),\n  red:     M('int_henna_red', 0x8e3b2c, 0.95),\n  ceiling: M('soundsorb_white', 0xf6f5f1, 1.0),\n  door:    M('door_prime_white', 0xf0eee8, 0.7),\n  glass:   M('glass', 0xbfd8dc, 0.05, 0, { transparent: true, opacity: 0.28, depthWrite: false }),\n  floor:   M('concrete_floor', 0xa9a49b, 0.9),\n  carpet:  M('studio_carpet_black', 0x141414, 1.0),\n  wall:    M('existing_wall', 0xdcd6cc, 0.95),\n  deskTop: M('desk_top_charcoal', 0x2b2b2d, 0.55),\n  deskBase:M('desk_base_white', 0xf2f1ee, 0.6),\n  micBody: M('rode_broadcaster_body', 0xc9bfa8, 0.38, 0.35),\n  foam:    M('windscreen_foam', 0x161616, 1.0),\n  armBlack:M('elgato_arm_black', 0x1c1c1e, 0.5, 0.2),\n  chassis: M('ip12_chassis', 0x3a3d42, 0.5, 0.25),\n  panel:   M('ip12_panel', 0x1d1f22, 0.6),\n  fader:   M('fader_cap', 0xd8d8d8, 0.5),\n  btnGrey: M('button_grey', 0x8e9196, 0.6),\n  btnGreen:M('button_on_green', 0x3fae5a, 0.5, 0, { emissive: 0x1d6b30, emissiveIntensity: 0.6 }),\n  btnRed:  M('button_off_red', 0xc8352b, 0.5, 0, { emissive: 0x6b1712, emissiveIntensity: 0.5 }),\n  led:     M('onair_led_red', 0xff3b2f, 0.3, 0, { emissive: 0xff2a1a, emissiveIntensity: 1.2 }),\n  screen:  M('meter_screen', 0x0e1a2a, 0.2, 0, { emissive: 0x16304f, emissiveIntensity: 0.8 }),\n};\n\nconst root = new THREE.Group(); root.name = 'southern_fm_studios';\nconst OX = 4.15, OZ = 3.5; // centre of 8300 x 7000 room\n\nfunction box(name, m, x0, x1, y0, y1, z0, z1, parent) {\n  const w = x1 - x0, h = y1 - y0, d = z1 - z0;\n  if (w <= 0.0005 || h <= 0.0005 || d <= 0.0005) return null;\n  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);\n  mesh.name = name;\n  mesh.position.set((x0 + x1) / 2 - OX, (y0 + y1) / 2, (z0 + z1) / 2 - OZ);\n  mesh.castShadow = mesh.receiveShadow = m !== mat.glass;\n  parent.add(mesh); return mesh;\n}\n\n// Slab running along an axis with rectangular openings [a0,a1,y0,y1] cut out.\n// axis 'x': runs a0..a1 in x, thickness c0..c1 in z. axis 'z': runs in z, thickness in x.\nfunction slab(name, m, axis, from, to, c0, c1, y0, y1, openings, parent) {\n  const g = new THREE.Group(); g.name = name; parent.add(g);\n  const ops = openings.filter(o => o[1] > from && o[0] < to).sort((a, b) => a[0] - b[0]);\n  const put = (a0, a1, b0, b1, i) => axis === 'x'\n    ? box(`${name}_${i}`, m, a0, a1, b0, b1, c0, c1, g)\n    : box(`${name}_${i}`, m, c0, c1, b0, b1, a0, a1, g);\n  let cur = from, i = 0;\n  for (const o of ops) {\n    const a0 = Math.max(o[0], from), a1 = Math.min(o[1], to);\n    put(cur, a0, y0, y1, i++);\n    put(a0, a1, y0, Math.max(y0, o[2]), i++);\n    put(a0, a1, Math.min(y1, o[3]), y1, i++);\n    cur = a1;\n  }\n  put(cur, to, y0, y1, i);\n  return g;\n}\n\nconst doorLeaves = [];\nconst mic4Sets = [];\nlet curtainClosed, curtainOpen;\nconst coveLeds = []; // per studio: ceiling strip material + its spill lights (for the MIC LIVE state)\nconst winFrame = M('window_frame_black', 0x0b0b0c, 0.85);\nconst roofs = [];\n\n// Wall with openings: builds leaves, paint skins, reveals, glazing, doors, steel joints.\n// side: 'N','S','E','W'. outer = outer-face coordinate; dir = +1/-1 inward.\nfunction studioWall(p, side, ops) {\n  const { name, x0, x1, z0, z1, H, layers, ext, int, ceil } = p;\n  const axis = (side === 'N' || side === 'S') ? 'x' : 'z';\n  const outer = { N: z0, S: z1, W: x0, E: x1 }[side];\n  const dir = (side === 'N' || side === 'W') ? 1 : -1;\n  const T = layers === 2 ? 0.198 : 0.061;\n  const lo = axis === 'x' ? x0 : z0, hi = axis === 'x' ? x1 : z1;\n  const g = new THREE.Group(); g.name = `${name}_wall_${side}`; p.group.add(g);\n  const span = (d0, d1) => { const a = outer + dir * d0, b = outer + dir * d1; return [Math.min(a, b), Math.max(a, b)]; };\n  const opRects = ops.map(o => [o.a0, o.a1, o.y0, o.y1]);\n  const inset = (d) => axis === 'x' ? 0 : d; // N/S run full length; E/W fit between\n  const wallTop = layers === 2 ? H - 0.05 : H - 0.05;\n\n  // outer leaf\n  let [c0, c1] = span(0, 0.05);\n  slab(`${g.name}_outer_leaf`, mat.natural, axis, lo + inset(0.05), hi - inset(0.05), c0, c1, 0.04, wallTop, opRects, g);\n  // exterior skin\n  [c0, c1] = span(-0.002, 0);\n  slab(`${g.name}_ext_finish`, ext[side] === 'white' ? mat.white : mat.natural, axis, lo, hi, c0, c1, 0.04, wallTop, opRects, g);\n  if (layers === 2) {\n    [c0, c1] = span(0.148, 0.198);\n    const ins = axis === 'x' ? 0.148 : 0.198;\n    slab(`${g.name}_inner_leaf`, mat.natural, axis, lo + ins, hi - ins, c0, c1, 0.0, ceil, opRects, g);\n  }\n  // interior paint skin\n  [c0, c1] = span(T, T + 0.002);\n  slab(`${g.name}_int_finish`, int, axis, lo + T, hi - T, c0, c1, 0.0, ceil, opRects, g);\n\n  // reveals, glazing, doors\n  ops.forEach((o, k) => {\n    const [r0, r1] = span(-0.004, T + 0.004);\n    const f = 0.035;\n    const put = (n, a0, a1, b0, b1, cc0, cc1, m) => axis === 'x'\n      ? box(`${g.name}_${n}${k}`, m, a0, a1, b0, b1, cc0, cc1, g)\n      : box(`${g.name}_${n}${k}`, m, cc0, cc1, b0, b1, a0, a1, g);\n    // reveals stand 3 mm proud of the cut slab faces so the leaf material can't z-fight through\n    const rm = o.type === 'window' || o.glass ? winFrame : mat.steel, pr = 0.003; // glass studio doors get the black frame too\n    put('reveal_head', o.a0 - f, o.a1 + f, o.y1 - pr, o.y1 + f, r0, r1, rm);\n    put('reveal_l', o.a0 - f, o.a0 + pr, o.y0, o.y1, r0, r1, rm);\n    put('reveal_r', o.a1 - pr, o.a1 + f, o.y0, o.y1, r0, r1, rm);\n    if (o.type === 'window') {\n      put('reveal_sill', o.a0 - f, o.a1 + f, o.y0 - f, o.y0 + pr, r0, r1, rm);\n      const panes = layers === 2 ? [0.025, 0.173] : [0.03];\n      if (!o.hatch) panes.forEach((d, j) => { const [a, b] = span(d - 0.003, d + 0.003); put(`glass${j}_`, o.a0, o.a1, o.y0, o.y1, a, b, mat.glass); });\n    } else {\n      // door leaf hinged on o.hinge ('lo'|'hi') edge, swinging inward\n      const w = o.a1 - o.a0, th = 0.04;\n      const pivot = new THREE.Group(); pivot.name = `${g.name}_door${k}_hinge`;\n      const hingeA = o.hinge === 'lo' ? o.a0 : o.a1;\n      const [dc0, dc1] = o.out ? span(0, th) : span(T - th, T);\n      const dc = (dc0 + dc1) / 2;\n      if (axis === 'x') pivot.position.set(hingeA - OX, 0, dc - OZ); else pivot.position.set(dc - OX, 0, hingeA - OZ);\n      const lh = o.y1 - 0.005, lw = w - 0.006;\n      let leaf;\n      if (o.glass) {\n        // full-height glass leaf in a slim black frame, long black pull handle\n        leaf = new THREE.Group();\n        const L = (n, u0, u1, y0, y1, t, m, off = 0) => { const mm = new THREE.Mesh(new THREE.BoxGeometry(axis === 'x' ? u1 - u0 : t, y1 - y0, axis === 'x' ? t : u1 - u0), m);\n          mm.name = `${g.name}_door${k}_${n}`; mm.castShadow = m !== mat.glass; const uc = (u0 + u1) / 2, yc = (y0 + y1) / 2 - lh / 2;\n          if (axis === 'x') mm.position.set(uc, yc, off); else mm.position.set(off, yc, uc); leaf.add(mm); return mm; };\n        const fw = 0.05;\n        L('stile_l', -lw / 2, -lw / 2 + fw, 0, lh, th, winFrame); L('stile_r', lw / 2 - fw, lw / 2, 0, lh, th, winFrame);\n        L('rail_top', -lw / 2, lw / 2, lh - fw, lh, th, winFrame); L('rail_bottom', -lw / 2, lw / 2, 0, 0.1, th, winFrame);\n        L('glass', -lw / 2 + fw, lw / 2 - fw, 0.1, lh - fw, 0.012, mat.glass);\n        const hs = o.hinge === 'lo' ? 1 : -1, hu = hs * (lw / 2 - 0.1);\n        [1, -1].forEach((f, q) => { L('pull_handle' + q, hu - 0.012, hu + 0.012, 0.75, 1.55, 0.024, winFrame, f * (th / 2 + 0.045));\n          [0.85, 1.45].forEach((yy, r2) => L(`pull_standoff${q}${r2}`, hu - 0.008, hu + 0.008, yy - 0.008, yy + 0.008, 0.045, winFrame, f * (th / 2 + 0.022))); });\n        leaf.name = `${g.name}_door${k}_leaf`;\n      } else {\n        leaf = new THREE.Mesh(new THREE.BoxGeometry(axis === 'x' ? lw : th, lh, axis === 'x' ? th : lw), mat.door);\n        leaf.name = `${g.name}_door${k}_leaf`; leaf.castShadow = leaf.receiveShadow = true;\n      }\n      const s = o.hinge === 'lo' ? 1 : -1;\n      if (axis === 'x') leaf.position.set(s * w / 2, lh / 2 + 0.003, 0); else leaf.position.set(0, lh / 2 + 0.003, s * w / 2);\n      pivot.add(leaf); g.add(pivot);\n      // inward swing sign\n      const sign = (axis === 'x' ? -1 : 1) * dir * s * (o.out ? -1 : 1);\n      doorLeaves.push({ pivot, sign });\n    }\n  });\n\n  // galvanised joint channels on exterior face\n  const n = Math.round((hi - lo) / 1.19);\n  const [s0, s1] = span(-0.006, -0.002);\n  for (let i = 0; i <= n; i++) {\n    const a = lo + (hi - lo) * i / n;\n    const aa0 = Math.max(lo, a - 0.025), aa1 = Math.min(hi, a + 0.025);\n    if (ops.some(o => aa1 > o.a0 - 0.04 && aa0 < o.a1 + 0.04)) continue;\n    if (axis === 'x') box(`${g.name}_stud${i}`, mat.steel, aa0, aa1, 0.04, wallTop, s0, s1, g);\n    else box(`${g.name}_stud${i}`, mat.steel, s0, s1, 0.04, wallTop, aa0, aa1, g);\n  }\n  // same panel-joint channels exposed on the interior face, stopping at openings\n  const [n0, n1] = span(T + 0.002, T + 0.006), ilo = lo + T, ihi = hi - T;\n  for (let i = 1; i < n; i++) {\n    const a = lo + (hi - lo) * i / n;\n    const aa0 = Math.max(ilo, a - 0.025), aa1 = Math.min(ihi, a + 0.025);\n    if (ops.some(o => aa1 > o.a0 - 0.04 && aa0 < o.a1 + 0.04)) continue;\n    if (axis === 'x') box(`${g.name}_int_stud${i}`, mat.steel, aa0, aa1, 0.0, ceil, n0, n1, g);\n    else box(`${g.name}_int_stud${i}`, mat.steel, n0, n1, 0.0, ceil, aa0, aa1, g);\n  }\n  // bottom + top tracks\n  const [t0, t1] = span(-0.006, T > 0.1 ? 0.05 : T);\n  if (axis === 'x') { box(`${g.name}_bottom_track`, mat.steel, lo, hi, 0, 0.04, t0, t1, g); box(`${g.name}_top_track`, mat.steel, lo, hi, wallTop, H - 0.05 + 0.004, t0, t1, g); }\n  else { box(`${g.name}_bottom_track`, mat.steel, t0, t1, 0, 0.04, lo, hi, g); box(`${g.name}_top_track`, mat.steel, t0, t1, wallTop, H - 0.05 + 0.004, lo, hi, g); }\n  if (layers === 2) acousticPanels(p, side, g, axis, span, T, lo, hi, ops);\n}\n\n// Acoustic option: fabric-wrapped panels in a staggered mosaic of studio-tinted shades + fluted timber accents.\nconst acousticGroups = [];\n// Diagonal-split felt tiles (~600 sq, each halved corner-to-corner) in a mixed palette, like the reference wall.\nconst feltCache = {};\nconst felt = (hex) => feltCache[hex] || (feltCache[hex] = M('acoustic_felt_' + hex.toString(16), hex, 1.0, 0, { side: THREE.DoubleSide }));\nfunction acousticPanels(p, side, wallG, axis, span, T, lo, hi, ops) {\n  const g = new THREE.Group(); g.name = `${wallG.name}_acoustic_panels`; wallG.add(g); acousticGroups.push(g);\n  // tight palette: three studio shades + one charcoal\n  const pal = p.int === mat.blue ? [0x1d5677, 0x2a6c90, 0x4f94b8, 0x173f5e] : [0x9e1f2b, 0xb92d36, 0xd0505a, 0x7e1824];\n  const a0 = lo + T, a1 = hi - T, y0 = 0.02, y1 = p.ceil, S = 0.4, gap = 0.003, f = 0.035;\n  const face = span(T, T)[0], dir = (side === 'N' || side === 'W') ? 1 : -1;\n  const hash = (i, j, k) => { let x = (i * 73856093) ^ (j * 19349663) ^ (k * 83492791) ^ side.charCodeAt(0) * 2654435761; x = (x ^ (x >>> 13)) * 1274126177; return ((x ^ (x >>> 16)) >>> 0) / 4294967296; };\n  // opening-free rectangles (same decomposition as the wall slabs)\n  const regs = []; let cur = a0;\n  ops.slice().sort((u, v) => u.a0 - v.a0).forEach(o => {\n    const oa0 = o.a0 - f, oa1 = o.a1 + f;\n    regs.push([cur, oa0, y0, y1]);\n    regs.push([oa0, oa1, y0, Math.max(y0, o.y0 - f)]);\n    regs.push([oa0, oa1, Math.min(y1, o.y1 + f), y1]);\n    cur = oa1;\n  });\n  regs.push([cur, a1, y0, y1]);\n  const clip = (poly, [r0, r1, s0, s1]) => {\n    const edges = [[(q) => q[0] >= r0, (p1, p2) => { const t = (r0 - p1[0]) / (p2[0] - p1[0]); return [r0, p1[1] + t * (p2[1] - p1[1])]; }],\n      [(q) => q[0] <= r1, (p1, p2) => { const t = (r1 - p1[0]) / (p2[0] - p1[0]); return [r1, p1[1] + t * (p2[1] - p1[1])]; }],\n      [(q) => q[1] >= s0, (p1, p2) => { const t = (s0 - p1[1]) / (p2[1] - p1[1]); return [p1[0] + t * (p2[0] - p1[0]), s0]; }],\n      [(q) => q[1] <= s1, (p1, p2) => { const t = (s1 - p1[1]) / (p2[1] - p1[1]); return [p1[0] + t * (p2[0] - p1[0]), s1]; }]];\n    for (const [inside, cut] of edges) {\n      const out = []; if (!poly.length) return out;\n      for (let i = 0; i < poly.length; i++) { const P = poly[i], Q = poly[(i + 1) % poly.length], pi = inside(P), qi = inside(Q);\n        if (pi) out.push(P); if (pi !== qi) out.push(cut(P, Q)); }\n      poly = out;\n    }\n    return poly;\n  };\n  const area = (pl) => Math.abs(pl.reduce((s, q, i) => { const r = pl[(i + 1) % pl.length]; return s + q[0] * r[1] - r[0] * q[1]; }, 0)) / 2;\n  const tri = (n, pts, m) => {\n    const sh = new THREE.Shape(); sh.moveTo(pts[0][0], pts[0][1]); pts.slice(1).forEach(q => sh.lineTo(q[0], q[1])); sh.closePath();\n    const geo = new THREE.ShapeGeometry(sh); geo.translate(0, 0, 0.009);\n    if (axis === 'x') geo.scale(1, 1, dir); else { ox(`${name}_floor`, mat.carpet, x0 + T, x1 - T, 0, 0.004, z0 + T, z1 - T, p.group);\n  // inner ceiling (soundsorb) for studios\n  if (layers === 2) {\n    roofs.push(box(`${name}_ceiling_soundsorb`, mat.ceiling, x0 + T, x1 - T, p.ceil, p.ceil + 0.05, z0 + T, z1 - T, p.group));\n  }\n  // roof: duplex beams + natural panels + steel edge\n  if (layers === 2) {\n    // LED strips: skirting (broken at doors) + cove just under the ceiling, tinted to the studio\n    const tint = name.includes('blue') ? 0x3d7bff : 0xff3a2a;\n    const coveTint = 0xeef4ff; // ceiling cove: white at rest, red when mics are live\n    const led = M(`${name}_led_strip_ceiling`, coveTint, 0.3, 0, { emissive: coveTint, emissiveIntensity: 3.4, toneMapped: false });\n    const ledW = M(`${name}_led_strip_floor_white`, 0xffffff, 0.3, 0, { emissive: 0xeef4ff, emissiveIntensity: 2.6, toneMapped: false });\n    const xi0 = x0 + T, xi1 = x1 - T, zi0 = z0 + T, zi1 = z1 - T, e = 0.012;\n    const sides = { N: [xi0, xi1, 'x', zi0, zi0 + e], S: [xi0, xi1, 'x', zi1 - e, zi1], W: [zi0, zi1, 'z', xi0, xi0 + e], E: [zi0, zi1, 'z', xi1 - e, xi1] };\n    const run = (n, a0, a1, ax, c0, c1, y0, y1, par) => { const m = y0 < 1 ? ledW : led; return ax === 'x' ? box(n, m, a0, a1, y0, y1, c0, c1, par) : box(n, m, c0, c1, y0, y1, a0, a1, par); };\n    const cove = new THREE.Group(); cove.name = `${name}_ceiling_led`; p.group.add(cove); roofs.push(cove);\n    const coveLights = []; coveLeds.push({ m: led, lights: coveLights, tint: 0xeef4ff });\n    // spill light so the strips actually wash the walls / floor\n    [[0.25, 0.05], [0.75, 0.05], [0.25, p.ceil - 0.05], [0.75, p.ceil - 0.05]].forEach(([f, y], k) => {\n      const pl = new THREE.PointLight(0xeef4ff, y < 1 ? 0.6 : 0.85, 3.2, 1.4);\n      pl.position.set(xi0 + (xi1 - xi0) * (k % 2 ? 0.75 : 0.25) - OX, y, (zi0 + zi1) / 2 - OZ); (y < 1 ? p.group : cove).add(pl);\n      if (y > 1) coveLights.push(pl);\n    });\n    Object.entries(sides).forEach(([sd, [a0, a1, ax, c
